<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hulegeb Electronics | የአስተዳዳሪ መግቢያ</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: rgba(79, 70, 229, 0.1);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            position: relative;
            overflow-x: hidden;
            padding: 1.25rem;
        }

        /* Dynamic Animated Background Blobs */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: #a855f7;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 2.25rem 2rem;
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Language Switcher */
        .language-switcher-admin {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 1.25rem;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            transition: var(--transition);
        }

        .lang-btn.active, .lang-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
            border-color: var(--primary);
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.85rem;
        }

        .login-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition);
            pointer-events: none;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 0.75rem 0.85rem 0.75rem 2.5rem;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #f8fafc;
            color: var(--text-dark);
            transition: var(--transition);
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .login-form input:focus + .input-icon,
        .login-form input:focus ~ .input-icon {
            color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        /* Options */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            font-size: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-muted);
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Error Box */
        .login-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            margin-top: 1rem;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            animation: shake 0.4s ease;
        }

        .login-error.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Footer */
        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: var(--transition);
            margin-bottom: 0.5rem;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .copyright {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Small Screens Mobile Adjustments */
        @media (max-width: 480px) {
            .login-box {
                padding: 1.75rem 1.25rem;
                border-radius: 20px;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .forgot-password {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="language-switcher-admin">
                <button class="lang-btn active" data-lang="en" onclick="setAdminLanguage('en')">EN</button>
                <button class="lang-btn" data-lang="am" onclick="setAdminLanguage('am')">አማ</button>
            </div>
            
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-microchip"></i>
                </div>
                <h1 data-i18n="storeName">Hulegeb Electronics</h1>
                <p data-i18n="adminLogin">Admin Panel Login</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" required placeholder="Enter username" data-i18n-placeholder="usernamePlaceholder">
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" data-i18n="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required placeholder="Enter password" data-i18n-placeholder="passwordPlaceholder">
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span data-i18n="rememberMe">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="forgotPassword">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    <span data-i18n="login">Login</span>
                </button>
                
                <div id="login-error" class="login-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-message"></span>
                </div>
            </form>
            
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    <span data-i18n="backToWebsite">Back to Website</span>
                </a>
                <p class="copyright">&copy; 2026 Hulegeb Electronics</p>
            </div>
        </div>
    </div>

    <script src="js/admin-translations.js"></script>
    <script src="js/admin.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
