<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hulegeb Electronics | የአስተዳዳሪ መግቢያ</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="language-switcher-admin">
                <button class="lang-btn active" data-lang="en" onclick="setAdminLanguage('en')">EN</button>
                <span>|</span>
                <button class="lang-btn" data-lang="am" onclick="setAdminLanguage('am')">አማ</button>
            </div>
            
            <div class="login-header">
                <i class="fas fa-microchip"></i>
                <h1 data-i18n="storeName">Hulegeb Electronics</h1>
                <p data-i18n="adminLogin">Admin Panel Login</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> <span data-i18n="username">Username</span></label>
                    <input type="text" id="username" required placeholder="Enter username" data-i18n-placeholder="usernamePlaceholder">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> <span data-i18n="password">Password</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Enter password" data-i18n-placeholder="passwordPlaceholder">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me"> <span data-i18n="rememberMe">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="forgotPassword">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="login">Login</span>
                </button>
                
                <div id="login-error" class="login-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-message"></span>
                </div>
            </form>
            
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="backToWebsite">Back to Website</span>
                </a>
                <p>&copy; 2024 Hulegeb Electronics</p>
            </div>
        </div>
    </div>

    <script src="js/admin-translations.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
