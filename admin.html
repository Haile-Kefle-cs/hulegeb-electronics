<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hulegeb Electronics | የአስተዳዳሪ መግቢያ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==================== Admin Login Styles ==================== */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --accent-color: #3b82f6;
            --text-color: #1f2937;
            --light-text: #6b7280;
            --background: #ffffff;
            --light-background: #f3f4f6;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            line-height: 1.5;
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
            position: relative;
            -webkit-overflow-scrolling: touch;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* ==================== Login Container ==================== */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative background elements */
        .login-container::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ==================== Login Box - Reduced Size ==================== */
        .login-box {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease;
            overflow: hidden;
            margin: 0 auto;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ==================== Language Switcher ==================== */
        .language-switcher-admin {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            width: 100%;
        }

        .language-switcher-admin span {
            color: var(--light-text);
            font-size: 0.85rem;
        }

        .lang-btn {
            background: none;
            border: 2px solid var(--border-color);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--light-text);
            padding: 5px 12px;
            transition: all 0.3s ease;
            border-radius: 20px;
            min-height: 35px;
            min-width: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .lang-btn.active {
            color: var(--primary-color);
            font-weight: 700;
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--primary-color);
        }

        .lang-btn:hover {
            background: var(--light-background);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* ==================== Login Header - Compact ==================== */
        .login-header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .login-header i {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            animation: bounce 2s infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .login-header h1 {
            font-size: 1.2rem;
            margin-bottom: 3px;
            word-wrap: break-word;
            color: var(--text-color);
        }

        .login-header p {
            color: var(--light-text);
            font-size: 0.8rem;
            word-wrap: break-word;
        }

        /* ==================== Login Form - Compact ==================== */
        .login-form {
            width: 100%;
            overflow: hidden;
        }

        .login-form .form-group {
            margin-bottom: 12px;
            width: 100%;
        }

        .login-form label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-color);
            word-wrap: break-word;
        }

        .login-form label i {
            color: var(--primary-color);
            font-size: 0.9rem;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .login-form input[type="text"],
        .login-form input[type="password"],
        .login-form input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            min-height: 40px;
            max-width: 100%;
            font-family: inherit;
            background: #f9fafb;
            color: var(--text-color);
        }

        .login-form input[type="text"]:focus,
        .login-form input[type="password"]:focus,
        .login-form input[type="email"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: white;
        }

        .login-form input::placeholder {
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--light-text);
            padding: 8px;
            min-height: 35px;
            min-width: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-password:hover {
            background: var(--light-background);
            color: var(--primary-color);
        }

        .toggle-password i {
            font-size: 1rem;
        }

        /* ==================== Login Options - Compact ==================== */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.8rem;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            flex-wrap: wrap;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .remember-me span {
            font-size: 0.8rem;
            color: var(--text-color);
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            white-space: nowrap;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            padding: 3px;
        }

        .forgot-password:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* ==================== Login Button - Compact ==================== */
        .btn-login {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 40px;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-login i {
            font-size: 1rem;
        }

        /* ==================== Login Error - Compact ==================== */
        .login-error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            word-wrap: break-word;
            animation: shake 0.5s ease;
            width: 100%;
        }

        .login-error.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ==================== Login Footer - Compact ==================== */
        .login-footer {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }

        .back-link {
            color: var(--light-text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        .back-link:hover {
            color: var(--primary-color);
            background: var(--light-background);
        }

        .login-footer p {
            font-size: 0.75rem;
            color: var(--light-text);
            word-wrap: break-word;
        }

        /* ==================== Responsive Design ==================== */
        @media (max-width: 768px) {
            .login-container {
                padding: 20px 15px;
            }

            .login-box {
                padding: 20px 25px;
                border-radius: 12px;
                max-width: 320px;
            }

            .login-header i {
                font-size: 2rem;
            }

            .login-header h1 {
                font-size: 1.1rem;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px 10px;
            }

            .login-box {
                padding: 20px;
                border-radius: 10px;
                max-width: 100%;
            }

            .login-header i {
                font-size: 1.8rem;
            }

            .login-header h1 {
                font-size: 1rem;
            }

            .login-form input[type="text"],
            .login-form input[type="password"],
            .login-form input[type="email"] {
                padding: 8px 10px;
                font-size: 0.85rem;
                min-height: 38px;
            }

            .btn-login {
                padding: 10px;
                font-size: 0.85rem;
                min-height: 38px;
            }

            .lang-btn {
                padding: 4px 10px;
                font-size: 0.8rem;
                min-height: 32px;
                min-width: 40px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 10px 8px;
            }

            .login-box {
                padding: 15px;
            }

            .login-header i {
                font-size: 1.5rem;
            }

            .login-header h1 {
                font-size: 0.95rem;
            }

            .login-options {
                gap: 3px;
            }
        }

        /* Desktop Large Screens */
        @media (min-width: 1024px) {
            .login-box {
                max-width: 350px;
            }
        }

        /* Touch Device Optimizations */
        @media (hover: none) {
            .btn-login:hover {
                transform: none;
                box-shadow: none;
            }

            .lang-btn:hover {
                background: none;
            }
        }

        /* iOS Specific Fixes */
        @supports (-webkit-touch-callout: none) {
            .login-container {
                min-height: -webkit-fill-available;
            }
            
            input[type="text"],
            input[type="password"],
            input[type="email"] {
                font-size: 16px !important;
            }
        }

        /* Prevent horizontal scroll */
        body,
        .login-container,
        .login-box,
        .login-form,
        .login-header,
        .login-footer,
        .login-options,
        .language-switcher-admin {
            max-width: 100%;
            overflow-x: hidden;
        }

        /* Ensure all elements stay within bounds */
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="language-switcher-admin">
                <button class="lang-btn active" data-lang="en" onclick="setAdminLanguage('en')">EN</button>
                <span>|</span>
                <button class="lang-btn" data-lang="am" onclick="setAdminLanguage('am')">አማ</button>
            </div>
            
            <div class="login-header">
                <i class="fas fa-microchip"></i>
                <h1 data-i18n="storeName">Hulegeb Electronics</h1>
                <p data-i18n="adminLogin">Admin Panel Login</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> <span data-i18n="username">Username</span></label>
                    <input type="text" id="username" required placeholder="Enter username" data-i18n-placeholder="usernamePlaceholder">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> <span data-i18n="password">Password</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Enter password" data-i18n-placeholder="passwordPlaceholder">
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me"> <span data-i18n="rememberMe">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="forgotPassword">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="login">Login</span>
                </button>
                
                <div id="login-error" class="login-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-message"></span>
                </div>
            </form>
            
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="backToWebsite">Back to Website</span>
                </a>
                <p>&copy; 2024 Hulegeb Electronics</p>
            </div>
        </div>
    </div>

    <script src="js/admin-translations.js"></script>
    <script src="js/admin.js"></script>
    
    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
